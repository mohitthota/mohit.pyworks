<!DOCTYPE html>
<html lang="en">
    <head>
        <title>font and text styling</title>
    <style>
        .font-size {
            font-size:24px;
        }
        .font-weight {
            font-weight:bold;
        }
        .font-style {
            font-style:italic;
        }
        .text-decoration{
            text-decoration:underline;
        }
        .text-transform{
            text-transform:uppercase;
        }
        .text-align{
            text-align:center;
        }      
    </style>    
    </head>
    <body>
        <h1>font and text styling</h1>
        <p class="font-size">this text has larger font size</p>
        <p class="font-weight">this text is bold</p>
        <p class="font-style">this text is italic</p>
        <p class="text-decoration">this text has underline</p>
        <p class="text-transform">this is transformed to uppercase</p>
        <p class="text-align">this text is center-aligned</p>
    </body>
</html>
