<!DOCTYPE html>
<html lang ="en">
<head>
    <title>CSS Colours</title>
    <style>
        .named-colour{
            color:red;
        }
        .hex-colour{
            color:green;
        }
        .rgb-colour{
            color:blue;
        }
        .rgba-colour{
            color:rgba(red);
        }
        .hsl-colour{
            color:green;
        }
        .hsla-colour{
            color:blue;
        }                        
    </style>
</head>
<body>
    <h1>css colour demonstration</h1>
    <p class="named-colour">this text uses a named colour(red)</p>
    <p class="hex-colour">this text uses a hex colour</p>
    <p class="rgb-colour">void int</p>
    <p class="rgba-colour">void int</p>
    <p class="hsl-colour">void int</p>
    <p class="hsla-colour">void int</p>
</body>
</html>
